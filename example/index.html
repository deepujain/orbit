<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orbit: a playskin example app</title>
  <script>
    // Before the first paint, so a saved skin or dark mode never flashes the plain look.
    try {
      const skin = localStorage.getItem("playskin");
      if (["aura", "crayon", "whiskers", "record"].includes(skin)) document.documentElement.setAttribute("data-playskin", skin);
      if (localStorage.getItem("orbit-dark") === "1") document.documentElement.classList.add("dark");
    } catch {}
  </script>
  <link rel="stylesheet" href="./app.css">
  <link rel="stylesheet" href="../themes/aura.css">
  <link rel="stylesheet" href="../themes/crayon.css">
  <link rel="stylesheet" href="../themes/whiskers.css">
  <link rel="stylesheet" href="../themes/record.css">
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
